/* 이 판에 실제로 쓴 시간(ms). 화면이 켜져 있는 동안만 센다 —
   앱을 내려놓고 온 시간까지 세면 "평균 소요 시간"이 의미를 잃는다. */
function playMsNow(){
  return S.playMs + (S.playAt ? Math.max(0, Date.now() - S.playAt) : 0);
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ S.playMs = playMsNow(); S.playAt = 0; }
  else S.playAt = Date.now();
});
/* 1분 12초처럼 사람이 읽는 꼴로 */
function fmtMs(ms){
  const sec = Math.round(ms / 1000);
  if(sec < 60) return `${sec}초`;
  const m = Math.floor(sec / 60), r = sec % 60;
  return r ? `${m}분 ${r}초` : `${m}분`;
}

/* ---------------- 시트 ---------------- */
const sheetBg = document.getElementById('sheetBg');
let sheetPushed = false;                 // 뒤로가기로 닫기 위해 기록을 하나 쌓아둔다
let sheetOpenedAt = 0;                   // 고스트 클릭 차단용 — 시트가 열린 시각
let popIgnoreUntil = 0;                  // closeSheet 직후 새 시트가 열렸을 때 뒤늦게 오는 popstate를 무시할 기한

/* 구간 막대를 눌러 전체 단계를 펼친다 — 시트가 새로 그려져도 듣도록 위임으로 붙인다 */
document.addEventListener('click', e => {
  const bar = e.target.closest && e.target.closest('[data-chaptoggle]');
  if(!bar) return;
  Snd.release(); Vib.tap();
  const list = bar.nextElementSibling;
  const open = bar.classList.toggle('open');
  if(list && list.classList.contains('chaplist')) list.classList.toggle('open', open);
});

function openSheet(html, locked){
  document.getElementById('sheet').innerHTML = html;
  sheetBg.dataset.locked = locked ? '1' : '';
  sheetBg.classList.add('open');
  sheetOpenedAt = performance.now();
  if(!sheetPushed){
    try{ history.pushState({minesSheet:1}, ''); sheetPushed = true; }catch(e){}
  }
}
function closeSheet(){
  const wasOpen = sheetBg.classList.contains('open');
  sheetBg.classList.remove('open');
  if(wasOpen && S.pendingTip){        // 힌트 시트를 어떤 방법으로 닫든 칸을 짚어준다
    const cells = S.pendingTip; S.pendingTip = null;
    setTimeout(() => showTipCells(cells), 120);
  }
  if(wasOpen && sheetPushed){
    sheetPushed = false;
    popIgnoreUntil = performance.now() + 700;
    try{ history.back(); }catch(e){}     // 쌓아둔 기록을 되돌려 놓는다
  }
}
/* 고스트 클릭 차단 — 판을 두 번 탭해 마지막 지뢰를 놓으면 두 번째 탭의 click 이벤트가
   리포트 시트가 뜬 "뒤에" 도착해, 그 손가락 자리에 있던 '다음 판으로'·'이 판 다시'를 눌러 버렸다.
   (테스터 리뷰 "가끔 리포트가 안 뜬다"의 원인) 시트가 열린 직후 300ms 안의 click은 무시한다. */
sheetBg.addEventListener('click', e => {
  if(performance.now() - sheetOpenedAt < 300){ e.stopPropagation(); e.preventDefault(); }
}, true);
window.addEventListener('popstate', () => {
  if(!sheetBg.classList.contains('open')) return;
  /* 닫으면 안 되는 팝업이거나, 방금 닫은 시트의 history.back()이 뒤늦게 도착한 것이면 기록만 다시 쌓는다
     (예: 클리어 → '다음 판으로' → 하트 안내 시트가 곧바로 열릴 때 그 시트가 닫혀 버리던 문제) */
  if(sheetBg.dataset.locked === '1' || performance.now() < popIgnoreUntil){
    try{ history.pushState({minesSheet:1}, ''); }catch(e){}
    return;
  }
  sheetPushed = false;
  sheetBg.classList.remove('open');
  Snd.release();
});
/* 시트 밖 빈 곳을 누르면 닫는다.
   예전엔 e.target === sheetBg 만 봐서, 화면 아래 "광고 자리"(#adSlot) 위를 누르면
   그 요소가 이벤트를 가로채 아무 일도 일어나지 않았다. 설정 화면은 세로로 길어
   위·옆 여백이 얇다 보니, 실제로 누를 수 있는 빈 곳이 거의 없었다. */
let closedByTapAt = 0;               // 시트 밖을 눌러 닫은 시각
function tapOutsideToClose(e){
  if(sheetBg.dataset.locked === '1') return;
  if(!sheetBg.classList.contains('open')) return;
  const sheet = document.getElementById('sheet');
  if(sheet && sheet.contains(e.target)) return;      // 시트 안이면 그대로 둔다
  closedByTapAt = performance.now();
  closeSheet();
}
/* 시트가 닫히면서 그 아래 있던 버튼이 같은 손짓의 click 을 받아 버렸다.
   힌트를 닫으려고 화면 아래를 눌렀는데 힌트 버튼이 눌려 힌트가 다시 뜨는 식이다 (테스터 지적).
   닫은 직후 350ms 안의 click 은 삼킨다. */
document.addEventListener('click', e => {
  if(performance.now() - closedByTapAt < 350){ e.stopPropagation(); e.preventDefault(); }
}, true);
sheetBg.addEventListener('pointerdown', tapOutsideToClose);
/* 광고 자리도 "빈 곳"으로 친다 — 단, 진짜 배너가 붙어 있으면(.live) 손대지 않는다.
   실제 앱에서는 배너가 웹뷰 위에 얹히는 네이티브 화면이라 이 핸들러까지 오지도 않는다. */
document.getElementById('adSlot').addEventListener('pointerdown', e => {
  if(e.currentTarget.classList.contains('live')) return;
  tapOutsideToClose(e);
});

/* ---------------- 안드로이드 뒤로가기 ----------------
   1) 팝업이 열려 있으면 → 팝업만 닫는다
   2) 아무것도 없으면 → 한 번 더 눌러야 나간다 (실수로 나가는 것 방지) */
(() => {
  const AppP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if(!AppP || !AppP.addListener) return;          // 웹에서는 조용히 넘어간다
  let armed = false, timer = null;
  AppP.addListener('backButton', () => {
    if(sheetBg.classList.contains('open')){
      if(sheetBg.dataset.locked === '1') return;  // 닫으면 안 되는 팝업은 무시
      Snd.release(); Vib.tap(); closeSheet();
      return;
    }
    if(S.dmode){ dailyLeaveAsk(); return; }     // [next #8]
    if(armed){
      armed = false; clearTimeout(timer);
      saveNow();                                   // 종료 직전에 반드시 쓴다
      try{ AppP.exitApp(); }catch(e){}
      return;
    }
    armed = true;
    Vib.tap();
    toast('뒤로 가기를 한 번 더 누르면 종료됩니다', '#5C6B85');
    clearTimeout(timer);
    timer = setTimeout(() => { armed = false; }, 2000);
  });
})();

function applyTutBar(){
  const bar = document.getElementById('tutbar');
  bar.classList.toggle('on', !S.tutDone);
  if(S.tutDone) return;
  const st = S.tutSteps[S.tutStep];
  if(!st){ bar.classList.remove('on'); applyRules(); return; }
  bar.innerHTML = `<b>${st.t} <span style="opacity:.75;font-size:11px">연습 ${S.tut}/3</span></b>${st.d}` +
    (st.btn ? `<button class="go" id="btnTutGo">${st.btn}</button>` : '');
  // 지금 뭔가 눌러야 하는 단계일 때만 안내바도 같이 반짝인다
  const acting = !!(st.btn || (st.cells && st.cells.length));
  bar.classList.toggle('pulse', acting);
  applyRules();                       // 지금 단계에 맞춰 규칙 카드 표시를 갱신
  if(st.btn) document.getElementById('btnTutGo').onclick = () => {
    Snd.release(); Vib.tap();
    // 규칙을 다 읽었다고 했으니 카드를 화면에서 없앤다 (설정에서 다시 볼 수 있다)
    if(st.target === 'rules'){ S.rulesRead = true; S.rulesOpen = false; applyRules(); requestAnimationFrame(fitBoard); save(); }
    S.tutStep++; applyTutBar(); update();
  };
}

/* 지금 눌러야 할 칸에 반짝임을 입힌다 */
function applyGuide(){
  const st = (!S.tutDone && S.tutSteps) ? S.tutSteps[S.tutStep] : null;
  const set = new Set((st && st.cells ? st.cells : []).map(([r,c]) => r*S.n + c));
  const tips = new Set((S.tipCells || []).map(([r,c]) => r*S.n + c));
  for(let r=0;r<S.n;r++) for(let c=0;c<S.n;c++){
    const el = cellEl(r,c), key = r*S.n + c;
    if(!el) continue;                                  // 보드를 다시 그리기 전이면 칸이 없을 수 있다
    el.classList.toggle('guide', set.has(key));
    el.classList.toggle('tiphit', tips.has(key) && !set.has(key));   // 튜토리얼 안내가 우선
  }

  // 보드가 아니라 규칙 카드를 짚어야 하는 단계
  const onRules = !!(st && st.target === 'rules');
  if(onRules && !S.rulesOpen){ S.rulesOpen = true; applyRules(); }
  document.getElementById('rules').classList.toggle('guide-el', onRules);
  document.getElementById('btnRules').classList.toggle('guide-el', onRules);
}

function checkTutStep(){
  if(S.tutDone || !S.tutSteps) return;
  const st = S.tutSteps[S.tutStep];
  if(st && st.done && st.done()){
    S.tutStep++;
    Snd.cheer(1); Vib.hit();
    applyTutBar();
  }
}

/* 쪽 고르기 — 쪽 번호를 누르면 그 자리에서 목록이 펼쳐진다.
   시트를 새로 열지 않고 붙였다 떼기만 해서, 보고 있던 자리를 잃지 않는다. */
function togglePagePicker(list, maxPage, PER){
  const old = document.getElementById('lvPagePick');
  if(old){ old.remove(); return; }                 // 다시 누르면 접는다
  const row = document.querySelector('.navrow');
  if(!row) return;
  const box = document.createElement('div');
  box.id = 'lvPagePick';
  box.className = 'pagepick';
  box.innerHTML = Array.from({length: maxPage}, (_, i) => {
    const pg = i + 1;
    const from = list[(pg-1)*PER], to = list[Math.min(pg*PER, list.length) - 1];
    return `<button class="pagebtn${pg === S.lvPage ? ' on' : ''}" data-pg="${pg}">
      <b>${pg}쪽</b><span>${from}~${to}</span></button>`;
  }).join('');
  row.insertAdjacentElement('afterend', box);
  box.querySelectorAll('[data-pg]').forEach(bt => bt.onclick = () => {
    Snd.release(); Vib.tap(); levelSelect(+bt.dataset.pg);
  });
  const cur = box.querySelector('.pagebtn.on');
  if(cur) cur.scrollIntoView({block:'nearest'});
}

/* 레벨 선택 화면을 나가면 모든 탭의 쪽 위치를 처음으로 되돌린다 */
function resetLvPages(){ S.lvPages = {}; S.lvPage = null; }   // null이면 지금 판이 있는 쪽으로 연다
const LV_TABS = [
  ['all',   '전체'],
  ['star',  '별 못 채운 판'],
  ['todo',  '미클리어'],
];
function levelSelect(page, tab){
  const PER = 100;
  const openMax = LEVELS.length;
  const prevTab = S.lvTab;
  S.lvTab = tab || S.lvTab || 'all';
  S.lvPages = S.lvPages || {};
  if(tab && tab !== prevTab) S.lvPage = S.lvPages[tab] || null;   // 탭을 바꾸면 그 탭에서 보던 쪽으로 (없으면 지금 판이 있는 쪽)

  // 탭에 맞는 레벨 목록을 먼저 뽑는다
  const list = [];
  for(let lv = 1; lv <= openMax; lv++){
    const rec = S.recs[lv];
    if(S.lvTab === 'star' && rec && rec.stars >= 3) continue;   // 별 3개면 제외
    if(S.lvTab === 'todo' && rec) continue;                     // 이미 깬 판 제외
    list.push(lv);
  }
  const maxPage = Math.max(1, Math.ceil(list.length / PER));
  if(page == null && !S.lvPage){
    // 처음 열 때는 지금 플레이 중인 판이 보이는 쪽으로 맞춘다
    const at = list.indexOf(S.level);
    S.lvPage = at >= 0 ? Math.floor(at / PER) + 1 : 1;
  }
  S.lvPage = Math.min(Math.max((page == null ? (S.lvPage || 1) : page), 1), maxPage);
  S.lvPages[S.lvTab] = S.lvPage;
  const slice = list.slice((S.lvPage - 1) * PER, S.lvPage * PER);

  const cells = slice.map(lv => {
    const rec = S.recs[lv];
    const cur = lv === S.level;
    const lock = isLocked(lv);
    return `<button class="lvcell${rec ? ' done' : ''}${cur ? ' cur' : ''}${lock ? ' lock' : ''}" data-lv="${lv}">
      <b>${lock ? '🔒' : lv}</b><span>${rec ? '★'.repeat(rec.stars) : (lock ? '' : '·')}</span></button>`;
  }).join('');

  const stars = Object.values(S.recs).reduce((a,r) => a + (r.stars||0), 0);
  const desc = S.lvTab === 'star' ? '별 3개를 채우지 못한 판이에요. 실수 없이 다시 깨면 별 3개가 됩니다.'
             : S.lvTab === 'todo' ? '아직 한 번도 깨지 않은 판이에요.'
             : `전체 ${openMax}판 · 모은 별 ${stars}개`;

  openSheet(`
    <button class="sheet-x" id="btnLvX" aria-label="닫기">✕</button>
    <h2>레벨 선택</h2>
    <div class="lvtabs">
      ${LV_TABS.map(([k,label]) =>
        `<button class="lvtab${S.lvTab===k?' on':''}" data-tab="${k}">${label}</button>`).join('')}
    </div>
    <p class="note" style="margin:2px 0 8px">${desc}</p>
    ${(() => { const pr = chapterProgress(S.level);
      return chapBarHtml(pr); })()}
    ${maxPage > 1 ? `<div class="navrow" style="margin:0 0 10px">
      <button class="navbtn" id="lvPrev" ${S.lvPage<=1?'disabled':''}>◀ 이전</button>
      <button class="navbtn" id="lvNum" style="flex:0 0 auto" title="쪽 고르기">${S.lvPage} / ${maxPage}쪽 ▾</button>
      <button class="navbtn" id="lvNext" ${S.lvPage>=maxPage?'disabled':''}>다음 ▶</button>
    </div>` : ''}
    ${list.length ? `<div class="lvgrid">${cells}</div>` :
      `<p style="padding:26px 0">🎉 해당하는 판이 없어요!<br>이 탭의 판을 모두 정복했습니다.</p>`}
    <button class="ghost" id="lvBack" style="margin-top:12px">설정으로</button>
  `);

  document.querySelectorAll('[data-tab]').forEach(bt => bt.onclick = () => {
    Snd.release(); Vib.tap(); levelSelect(null, bt.dataset.tab);
  });
  document.querySelectorAll('[data-lv]').forEach(bt => bt.onclick = () => {
    Snd.release(); Vib.tap();
    const to = +bt.dataset.lv;
    if(isLocked(to)){ toast(`${Math.max(S.maxLevel, S.level)}판까지 열려 있어요`, '#E4484F'); return; }
    if(!canPlay(to)){ energySheet(); return; }   // 시트 위에서 내용만 교체
    resetLvPages(); closeSheet();
    S.level = to; S.pending = null; saveNow(); newPuzzle(true);
  });
  const pv = document.getElementById('lvPrev'), nx = document.getElementById('lvNext');
  if(pv) pv.onclick = () => { Snd.release(); levelSelect(S.lvPage - 1); };
  if(nx) nx.onclick = () => { Snd.release(); levelSelect(S.lvPage + 1); };
  /* 쪽 번호를 누르면 쪽 목록을 펼친다 — 34쪽을 '다음'만 눌러 넘어갈 수는 없다 */
  const num = document.getElementById('lvNum');
  if(num) num.onclick = () => { Snd.release(); Vib.tap(); togglePagePicker(list, maxPage, PER); };

  // 좌우로 밀어서 쪽 넘기기 (세로 스크롤과 겹치지 않게 가로 이동이 확실할 때만)
  S.lvMaxPage = maxPage;
  if(S.lvSlide){
    const g2 = document.querySelector('.lvgrid');
    if(g2) g2.classList.add(S.lvSlide);
    S.lvSlide = null;
  }
  document.getElementById('lvBack').onclick = () => { Snd.release(); resetLvPages(); settings(); };
  document.getElementById('btnLvX').onclick = () => { Snd.release(); Vib.tap(); resetLvPages(); closeSheet(); };
}

/* ── 내 기록 ── */
function statsSheet(){
  const recs = Object.entries(S.recs);
  const cleared = recs.length;
  const stars = recs.reduce((a,[,r]) => a + (r.stars||0), 0);
  const cnt = {};
  recs.forEach(([,r]) => cnt[r.rank] = (cnt[r.rank]||0) + 1);
  const totalScore = recs.reduce((a,[,r]) => a + (r.score||0), 0);
  const maxStars = cleared * 3;
  /* 획득률은 FLAWLESS(5)도 3개로 쳐서 100%를 넘지 않게 한다 */
  const starsCapped = recs.reduce((a,[,r]) => a + Math.min(3, r.stars||0), 0);
  const starPct = maxStars ? Math.round(starsCapped / maxStars * 100) : 0;
  const best = recs.reduce((a,[lv,r]) => (!a || r.score > a.r.score) ? {lv, r} : a, null);
  /* 판당 소요 시간은 recs[].ms 에 계속 쌓이지만 이 화면에는 표시하지 않는다.
     쓰지도 않을 평균·최속을 매번 계산하고 있어 걷어냈다 (10차 §5-A2). */

  openSheet(`
    <button class="sheet-x" id="btnStX" aria-label="닫기">✕</button>
    <h2>내 기록</h2>
    <div class="sub" style="margin:2px 0 4px">📅 매일 들어오면 하트를 드려요 · 지금 ${S.dayStreak || 0}일째</div>
    <div class="daybar">${dayDotsHtml()}</div>
    <div class="statline" style="margin-top:12px">
      <div class="statbox"><b>${cleared}</b><span>클리어한 판<br>(전체 ${LEVELS.length.toLocaleString()}판)</span></div>
      <div class="statbox"><b>★ ${stars}</b><span>모은 별<br>(전체 ${maxStars})</span></div>
      <div class="statbox"><b>${starPct}%</b><span>별 획득률</span></div>
    </div>
    <div class="report">
      ${RANKS.map(([,name,,st,color]) =>
        `<div><dt><span style="color:${color}">●</span> ${name}</dt><dd>${cnt[name] || 0}판</dd></div>`).join('')}
      <div><dt>최고 점수</dt><dd>${best ? `${best.r.score}점 (${best.lv}판)` : '-'}</dd></div>
      <div><dt>가장 멀리 간 판</dt><dd>${S.maxLevel}판</dd></div>
      <div><dt>무실수 연속 최고</dt><dd>${S.bestStreak || 0}판</dd></div>
      <div><dt>지금 연속</dt><dd>${S.streak || 0}판</dd></div>
      <div><dt>지금 구간</dt><dd>${chapterOf(S.level).icon} ${chapterOf(S.level).name}</dd></div>
    </div>
    ${(() => { const pr = chapterProgress(S.level);
      return chapBarHtml(pr); })()}
    <button class="ghost" id="stBack">설정으로</button>
  `);
  document.getElementById('stBack').onclick = () => { Snd.release(); settings(); };
  document.getElementById('btnStX').onclick = () => { Snd.release(); Vib.tap(); closeSheet(); };
}

function applyRules(){
  /* 규칙 카드는 '규칙을 읽는 단계'에서만 보인다.
     '다 읽었어요'를 누르면 다음 단계로 넘어가면서 자동으로 사라진다.
     저장된 값에 기대지 않으므로 언제 다시 시작해도 처음엔 항상 보인다. */
  const step = (!S.tutDone && S.tutSteps) ? S.tutSteps[S.tutStep] : null;
  const gone = S.tutDone || !(step && step.target === 'rules');
  document.getElementById('rules').classList.toggle('gone', gone);
  document.getElementById('btnRules').classList.add('gone');      // 토글 버튼은 항상 숨김
  if(gone){ requestAnimationFrame(fitBoard); return; }
  document.getElementById('rules').classList.toggle('hidden', !S.rulesOpen);
  const b = document.getElementById('btnRules');
  b.classList.toggle('closed', !S.rulesOpen);
  b.setAttribute('aria-expanded', String(S.rulesOpen));
}

/* 보드를 뺀 나머지 UI 높이를 매번 새로 재서 보드 크기를 정한다.
   (예전에는 값을 누적해서 규칙을 여닫을 때마다 보드가 계속 작아지는 버그가 있었다) */
let vhBase = 0, vhWidth = 0;
/* 화면 높이 기준값 — 주소창이 접혔다 펴져도 판 크기가 출렁이지 않게 한 번 잡으면 유지한다.
   가로폭이 바뀌면(회전·창 크기 변경) 다시 잡는다. */
function lockVH(){
  const w = window.innerWidth, h = window.innerHeight;
  if(window.Capacitor){ vhWidth = w; vhBase = h; }   // 앱에는 주소창이 없다 — 항상 지금 높이를 쓴다
  else if(w !== vhWidth){ vhWidth = w; vhBase = h; }
  else if(h < vhBase) vhBase = h;          // (브라우저) 더 좁아졌을 때만 갱신 — 주소창 출렁임 방지
  document.documentElement.style.setProperty('--vh', vhBase + 'px');
}
/* ⚠️ 예전엔 앱에서도 "세션 중 최소 높이"를 고정했다. 앱이 뜨는 순간 WebView 높이가 잠깐 작게 잡히면
   (안드로이드 15 인셋 적용 전후 등) 그 값이 재실행 때까지 남아 판이 폭보다 작게 그려졌다 (S26 리뷰 2번). */

function fitBoard(){
  const wrap = document.querySelector('.board-wrap');
  if(!wrap) return;
  lockVH();
  document.body.classList.toggle('tut', !S.tutDone);   // 연습 중에는 판을 줄이지 않는다
  // 화면이 낮으면 규칙 카드를 접어 조작 버튼이 밀려나지 않게 한다
  if(vhBase < 720 && S.rulesOpen && S.tutDone){
    S.rulesOpen = false; applyRules();
  }
  const cs = getComputedStyle(document.body);
  const gap = parseFloat(cs.rowGap || cs.gap) || 9;
  let used = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  /* 광고 자리는 body 의 padding-bottom(--adh + 안전영역)에 이미 들어 있다.
     예전엔 여기서 광고칸 높이를 한 번 더 빼서(이중 차감) 판이 56~104px 작게 그려졌다. */
  let shown = 0;
  for(const el of document.body.children){
    if(el === wrap) { shown++; continue; }
    if(el.id === 'sheetBg' || el.id === 'rain') continue;
    // 규칙 카드·튜토리얼 안내는 여닫을 때 보드 크기가 흔들리지 않도록 기본은 제외한다.
    // 다만 화면이 낮으면(작은 폰) 조작 버튼이 밀려나므로 그때는 포함해서 계산한다.
    if(el.id === 'rules' || el.id === 'tutbar'){
      /* 연습 중에는 안내가 크므로 계산에서 빼고 화면 스크롤에 맡긴다.
         (판을 줄이면 좌우가 텅 비어 보기 나쁘다) */
      continue;
    }
    if(getComputedStyle(el).position === 'fixed') continue;
    const h = el.offsetHeight;
    if(h > 0){ used += h; shown++; }
  }
  used += gap * Math.max(0, shown - 1);
  const wrapCS = getComputedStyle(wrap);
  used += parseFloat(wrapCS.paddingTop) + parseFloat(wrapCS.paddingBottom);
  document.documentElement.style.setProperty('--chrome', Math.round(used) + 'px');
}
/* 레벨 선택 화면에서 좌우로 밀면 쪽을 넘긴다 */
(() => {
  let sx = 0, sy = 0, on = false;
  const active = () => sheetBg.classList.contains('open') && document.querySelector('.lvgrid');
  document.addEventListener('pointerdown', e => {
    if(!active()) return;
    sx = e.clientX; sy = e.clientY; on = true;
  }, true);
  document.addEventListener('pointerup', e => {
    if(!on) return;
    on = false;
    if(!active()) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    const to = (S.lvPage || 1) + (dx < 0 ? 1 : -1);
    if(to < 1 || to > (S.lvMaxPage || 1)) return;
    Snd.release(); Vib.tap();
    S.lvSlide = dx < 0 ? 'slide-l' : 'slide-r';
    levelSelect(to);
  }, true);
  document.addEventListener('pointercancel', () => { on = false; }, true);
})();

/* ── [next #8] 오늘의 도전 ────────────────────────────────────────
   하루 한 판, 하트 없이. 같은 코스끼리는 같은 날 같은 판을 받는다 — 인터넷 없이 날짜만으로 고른다.
   판은 이미 전수 검증된 3333판을 돌리거나 뒤집고 색을 바꿔 쓴다. 정답이 하나뿐인 성질은 그대로 유지된다.
   방향에 따라 rateDifficulty 점수가 달라지므로, PC에서 8방향을 모두 다시 재서 등급이 맞는 조합만 DAILY_POOL 에 넣었다.
   코스는 그날 처음 켤 때 깬 판 수로 정하고 하루 동안 바꾸지 않는다. 본 게임에서 아직 못 본 난이도는 내지 않는다. */
const DAILY_COURSES = [   // days: [일, 월, 화, 수, 목, 금, 토] — 등급 첫 글자 + 크기
  {name:'새싹 코스', upto: 299,      days:['n10','l9','l9','l10','l10','l11','n9']},
  {name:'성장 코스', upto: 999,      days:['n11','l10','n9','n10','n10','c9','c10']},
  {name:'숙련 코스', upto: 1999,     days:['c11','n9','n10','c9','c10','v9','v10']},
  {name:'고수 코스', upto: Infinity, days:['v11','c9','c10','v9','v10','x9','x10']},
];
const DAILY_WEEK = ['일','월','화','수','목','금','토'];
const DAILY_EPOCH = Date.UTC(2026, 9, 5);          // 판 순서를 세는 기준일 — 바꾸면 모두의 판이 바뀐다
const STORE_URL = 'https://play.google.com/store/apps/details?id=com.studio1231.minesweeper';
const WEB_URL = 'https://1231studio.github.io/mines_daily/';   // 공유 링크 — 받은 사람이 브라우저에서 같은 판을 푼다
const WEB = window.WEB_DAILY === true;                  // 웹 빌드에서만 true (tools/web/build_web.py 가 넣는다)
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const NOTIF_H = 13, NOTIF_M = 30;                  // 알림 시각 (오후 1시 30분)

function dailyParse(key){ const [y, m, d] = key.split('-').map(Number); return {y, m, d}; }
function dailyDayNo(key){ const {y, m, d} = dailyParse(key); return Math.round((Date.UTC(y, m - 1, d) - DAILY_EPOCH) / 864e5); }
function dailyWeekday(key){ const {y, m, d} = dailyParse(key); return new Date(y, m - 1, d).getDay(); }
function dailyLabel(key){ const {m, d} = dailyParse(key); return `${m}월 ${d}일 ${DAILY_WEEK[dailyWeekday(key)]}요일`; }
function dailyShort(key){ const {m, d} = dailyParse(key); return `${m}월 ${d}일 (${DAILY_WEEK[dailyWeekday(key)]})`; }
function dailyPrevKey(key){
  const {y, m, d} = dailyParse(key), t = new Date(y, m - 1, d - 1), p = x => String(x).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}
/* 그날 처음 정한 코스를 하루 동안 유지한다 (깬 판 수 = maxLevel − 1) */
function dailyCourse(){
  const key = todayKey(), D = S.daily;
  if(!D.day || D.day.key !== key){
    const cleared = Math.max(0, S.maxLevel - 1);
    D.day = {key, course: Math.max(0, DAILY_COURSES.findIndex(c => cleared <= c.upto))};
  }
  return D.day.course;
}
/* 8가지 회전·뒤집기 (t: 1=좌우, 2=상하, 4=대각 전치 — 조합) */
function dailyXform(d, t){
  const n = d.n;
  const map = (r, c) => { let R = r, C = c; if(t & 4){ const x = R; R = C; C = x; } if(t & 1) C = n - 1 - C; if(t & 2) R = n - 1 - R; return [R, C]; };
  const reg = Array.from({length: n}, () => new Array(n).fill(0)), sol = new Array(n).fill(0);
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++){ const [R, C] = map(r, c); reg[R][C] = d.reg[r][c]; }
  for(let r = 0; r < n; r++){ const [R, C] = map(r, d.sol[r]); sol[R] = C; }
  return {reg, sol};
}
/* 날짜 + 코스 → 오늘의 판.
   같은 조합(예: 보통 10×10)을 여러 코스·요일이 함께 쓰므로, 주 번호 × 그 조합을 쓰는 칸 수 + 내 칸 순번으로
   목록을 차례로 내려가며 겹치지 않게 고른다. 목록을 한 바퀴 다 쓰면 다른 방향으로 다시 쓴다. */
const dailyPickCache = {};
function dailyPick(key, ci){
  const ck = key + '|' + ci;
  if(dailyPickCache[ck]) return dailyPickCache[ck];
  const wd = dailyWeekday(key), combo = DAILY_COURSES[ci].days[wd];
  let k = 0, o = 0;
  DAILY_COURSES.forEach((c, i) => c.days.forEach((x, j) => { if(x === combo){ if(i === ci && j === wd) o = k; k++; } }));
  const str = DAILY_POOL[combo], len = str.length / 5;
  const day = dailyDayNo(key) + 7000;                // 기준일 이전 날짜도 양수로
  const pos = Math.floor(day / 7) * k + o, e = pos % len, cyc = Math.floor(pos / len);
  const idx = parseInt(str.substr(e * 5, 3), 36), mask = parseInt(str.substr(e * 5 + 3, 2), 36);
  const ts = []; for(let t = 1; t < 8; t++) if(mask >> t & 1) ts.push(t);
  const base = decodeLevel(LEVELS[idx]);
  const x = dailyXform(base, ts[cyc % ts.length]);
  return (dailyPickCache[ck] = {n: base.n, sol: x.sol, reg: x.reg, grade: combo[0], seed: day * 131 + ci * 17 + 5});
}

/* ── 메인 화면 카드 ── */
let dailyCardHtml = null;
function drawDailyCard(){
  const el = document.getElementById('dailyCard');
  if(!el || !S.daily) return;
  const key = todayKey();
  const avail = !!S.tutDone && !S.dmode && S.daily.hide !== key;
  const mini = (vhBase || innerHeight) < 640;           // 카드를 넣으면 조작 버튼이 밀려나는 높이
  const show = avail && !mini && !S.daily.recs[key];   // 다 풀었으면 카드는 저절로 사라진다
  const slim = (vhBase || innerHeight) < 700 || innerWidth < 330;
  { const chip = document.getElementById('dayChip'); let dot = chip && chip.querySelector('.ddot');
    const want = avail && mini && !S.daily.recs[key];
    if(chip && want && !dot){ dot = document.createElement('i'); dot.className = 'ddot'; chip.appendChild(dot); }
    if(dot && !want) dot.remove(); }
  let html = '';
  if(show){
    const rec = S.daily.recs[key];
    if(rec){
      html = `<div class="dico">${CAL_SVG}</div><div class="dtxt"><b>오늘의 도전 완료 ✓</b>`
        + (slim ? '' : `<span>${S.daily.streak}일 연속 · 내일 새 판이 열려요</span>`)
        + `</div><button class="dgo" id="dailyShareBtn">공유</button>`;
    } else {
      const p = dailyPick(key, dailyCourse()), g = `${TIER_KO[p.grade]} ${p.n}×${p.n}`;
      html = `<div class="dico">${CAL_SVG}</div><div class="dtxt"><b>오늘의 도전${slim ? ' · ' + g : ''}</b>`
        + (slim ? '' : `<span>${dailyLabel(key)} · ${g}</span>`)
        + `</div><button class="dgo" id="dailyGoBtn">도전</button>`;
    }
    html += `<button class="dx" id="dailyXBtn" aria-label="오늘은 그만 보기">✕</button>`;
    html = (rec ? 'D' : 'N') + (slim ? 'S' : 'W') + html;   // 상태가 바뀌면 다시 그린다
  }
  if(html === dailyCardHtml) return;
  dailyCardHtml = html;
  el.innerHTML = html.slice(2);
  el.classList.toggle('done', html[0] === 'D');
  el.classList.toggle('slim', html[1] === 'S');
  el.hidden = !show;
  if(show){
    const go = document.getElementById('dailyGoBtn'), sh = document.getElementById('dailyShareBtn');
    if(go) go.onclick = startDaily;
    if(sh) sh.onclick = () => dailyShare(key);
    document.getElementById('dailyXBtn').onclick = () => {
      Snd.release(); Vib.tap();
      S.daily.hide = key; save(); drawDailyCard();
      toast('오늘의 도전은 내일 다시 보여드릴게요', '#5C6B85');
    };
  }
  fitBoard();                                        // 카드가 생기거나 사라지면 판 크기를 다시 잰다
}

/* 본 게임 진행을 맡겨 둔다 — 저장 형식(pending)과 같은 모양이라 돌아올 때 그대로 이어받는다 */
function takeMainSnap(){
  const fin = !!S.done;      // 끝난 판의 칸은 저장하지 않는 writeSave 규칙과 같다
  return {
    level: S.level, cells: fin ? [] : S.cells.map(r => r.slice()), wrong: fin ? [] : [...S.wrong],
    lives: fin ? 3 : S.lives, fish: fin ? 3 : S.fish, undoLeft: fin ? 3 : S.undoLeft, pureRun: fin ? true : S.pureRun, xTaps: fin ? 0 : S.xTaps,
    playMs: fin ? 0 : playMsNow(), stats: fin ? {sweeps: 0, wasted: 0} : {...S.stats}, combo: fin ? 0 : S.combo, bestCombo: fin ? 0 : S.bestCombo,
    bkey: (!fin && LEVELS[S.level - 1]) ? LEVELS[S.level - 1].slice(0, 12) : '',
  };
}
function startDaily(){
  if(S.busy || S.dmode || !S.tutDone || S.done) return;
  Snd.release(); Vib.tap();
  S.mainSnap = takeMainSnap();
  S.dKey = todayKey(); S.dCourse = dailyCourse(); S.dHints = 0;
  S.dmode = true; S.dEnter = true;
  saveNow();
  newPuzzle(true);
}
function leaveDailyState(){
  S.dmode = false; S.dEnter = false; S.devPick = null;
  const q = S.mainSnap; S.mainSnap = null;
  if(q && !S.pending && q.level === S.level) S.pending = q;
}
function exitDaily(){
  if(S.busy) return;
  const cleared = !S.devPick && !!S.daily.recs[S.dKey];
  closeSheet();
  leaveDailyState();
  newPuzzle(true);
  if(cleared) setTimeout(dailyAskNotif, 900);       // 첫 클리어 뒤 한 번만 알림 허락(안드로이드 13+ 시스템 창)
}

/* ── 클리어 ── */
function fmtClock(ms){ const t = Math.round(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function dailyWin(){
  S.done = true;
  if(S.devPick){ devDone(true); return; }   // [next] 개발자 테스트 판 — 기록·연속·알림 없음
  const key = S.dKey || todayKey(), D = S.daily, prev = D.recs[key];
  const miss = 3 - S.lives, stars = Math.max(1, Math.min(3, S.lives));
  const ms = Math.min(playMsNow(), 3600000), hints = S.dHints || 0;
  if(!prev && WEB){
    D.recs[key] = {stars, ms, miss, hints, course: S.dCourse};
  } else if(!prev){
    D.streak = (D.last === dailyPrevKey(key)) ? D.streak + 1 : 1;
    D.best = Math.max(D.best, D.streak); D.last = key; D.total++;
    D.recs[key] = {stars, ms, miss, hints, course: S.dCourse};
    const keys = Object.keys(D.recs).sort(); while(keys.length > 30) delete D.recs[keys.shift()];
  } else if(stars > prev.stars || (stars === prev.stars && ms < prev.ms)){
    D.recs[key] = {stars, ms, miss, hints, course: prev.course};
  }
  Snd.chime(); Vib.hit(); rain(); saveNow(); update();
  scheduleDailyNotifs();                             // 오늘은 이미 했으니 오늘 알림은 뺀다
  const c = DAILY_COURSES[S.dCourse] || DAILY_COURSES[0];
  const starRow = [0, 1, 2].map(i => `<span class="bigstar${i < stars ? ' on' : ''}">★</span>`).join('');
  openSheet(`
    <div class="rankcard" style="--rc:#7C5CE6">
      <div class="stars">${starRow}</div>
      <div class="rankname">오늘의 도전 완료!</div>
      <div class="ranksub">${c.name} · ${TIER_KO[S.grade] || ''} ${S.n}×${S.n}</div>
    </div>
    ${WEB ? '' : `<div class="streak">📅 오늘의 도전 <b>${D.streak}일</b> 연속!${D.streak >= 2 && D.streak === D.best ? ' <span>최고 기록</span>' : ''}</div>`}
    <div class="scoreline">
      <div><b>${fmtClock(ms)}</b><span>걸린 시간</span></div>
      <div><b>${miss}</b><span>실수</span></div>
      <div><b>${hints}</b><span>힌트</span></div>
    </div>
    <button class="primary" id="btnDShare">결과 공유하기</button>
    ${WEB ? webAppBtn() : '<button class="ghost" id="btnDBack">본 게임으로 돌아가기</button>'}

async function dailyShare(key){
  const text = dailyShareText(key);
  if(!text) return;
  Snd.release(); Vib.tap();
  const C = window.Capacitor, P = C && C.Plugins && C.Plugins.Share;
  if(P && (!C.isPluginAvailable || C.isPluginAvailable('Share'))){
    try{ await P.share({text, dialogTitle: '결과 공유하기'}); }catch(e){}   // 공유창을 닫아도 오류로 온다 — 무시
    return;
  }
  /* 휴대폰 브라우저는 공유창, PC 는 복사. 공유창을 닫은 것(AbortError)이 아니면 복사로 넘어간다 */
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if(navigator.share && coarse){
    try{ await navigator.share({text}); return; }catch(e){ if(e && e.name === 'AbortError') return; }
  }
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){
    try{ const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); ok = document.execCommand('copy'); t.remove(); }catch(e2){}
  }
  /* 알림(toast)은 팝업 아래에 깔려 안 보인다 — 팝업이 열려 있으면 버튼 글씨로 알려준다 */
  const btn = document.getElementById('btnDShare');
  if(btn && sheetBg.classList.contains('open')){
    const was = btn.textContent;
    btn.textContent = ok ? '✓ 복사했어요! 카톡에 붙여넣으세요' : '공유하지 못했어요';
    setTimeout(() => { btn.textContent = was; }, 2400);
  } else toast(ok ? '결과를 복사했어요. 카톡에 붙여넣어 보내세요' : '공유하지 못했어요', '#5C6B85');
}

/* ── [next #9] 데일리 알림 ──────────────────────────────────────
   매일 13:30 에 한 번. 그날 이미 풀었으면 보내지 않는다. 앱을 켤 때마다 앞으로 3일치만 다시 예약하므로
   사흘 동안 안 들어오면 저절로 멈춘다. 끄는 건 폰의 알림 설정에서 — 앱 안에 따로 두지 않는다.
   정확한 시각 알람 권한은 쓰지 않는다(Play 정책상 알람·캘린더 앱용) → 13:30 전후 몇 분 안에 도착. */
function notifPlugin(){
  try{
    const C = window.Capacitor;
    if(!C || !C.Plugins || !C.Plugins.LocalNotifications) return null;
    if(C.isPluginAvailable && !C.isPluginAvailable('LocalNotifications')) return null;
    return C.Plugins.LocalNotifications;
  }catch(e){ return null; }
}
const NOTIF_IDS = [1301, 1302, 1303];
let notifBusy = false;
async function scheduleDailyNotifs(){
  const P = notifPlugin();
  if(!P || !S.tutDone || notifBusy) return;
  notifBusy = true;
  try{
    const perm = await P.checkPermissions();
    if(!perm || perm.display !== 'granted') return;
    await P.cancel({notifications: NOTIF_IDS.map(id => ({id}))});
    const now = new Date(), today = todayKey(), D = S.daily;
    const doneToday = !!D.recs[today];
    const alive = D.last === today || D.last === dailyPrevKey(today);   // 연속 기록이 살아 있는가
    const list = [];
    for(let i = 0; i < 4 && list.length < NOTIF_IDS.length; i++){
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, NOTIF_H, NOTIF_M);
      if(at <= now || (i === 0 && doneToday)) continue;
      const first = list.length === 0;
      list.push({
        id: NOTIF_IDS[list.length],
        title: '🧩 오늘의 도전판이 열렸어요',
        body: (first && alive && D.streak >= 2) ? `📅 ${D.streak}일 연속 기록을 이어가 보세요` : '하트 없이 하루 한 판, 지금 풀어보세요',
        schedule: {at: at.toISOString(), allowWhileIdle: true},
        isExactNotification: false,
        smallIcon: 'ic_stat_daily', iconColor: '#7C5CE6',
      });
    }
    if(list.length) await P.schedule({notifications: list});
  }catch(e){}
  finally{ notifBusy = false; }
}
/* [1.2.0] 알림 허용을 거절한(또는 폰 설정에서 끈) 사람에게만, 클리어 화면 맨 아래 흐린 글자 한 줄.

/* ── 연속 출석 ─────────────────────────
   하루에 한 번, 앱을 켜면 보상을 준다. 어제 왔으면 이어지고, 하루라도 건너뛰면 1일부터 다시.
   보상은 하트로 준다 — 힌트·되돌리기는 판이 바뀌면 3개로 되돌아가서 선물이 되지 못한다.
   그래서 이때만 하트가 평소 상한(5, ENERGY_MAX)을 넘어 최대 10개까지 쌓일 수 있게 했다.
   [next] 이 보너스 상한만 9 → 10 으로 올림. 평소 회복·광고 리필 상한(5)은 그대로. */
const DAY_MAX_ENERGY = 10;
function todayKey(){
  const d = new Date();
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function dayReward(streak){
  /* 7일 한 바퀴 — 7일째가 가장 크고, 그 뒤로는 계속 7일째 보상이 나온다 */
  const table = [1, 1, 2, 2, 2, 3, 3];
  return table[Math.min(streak, 7) - 1] || 1;
}
function checkDailyStreak(){
  const today = todayKey();
  if(S.lastDay === today){ drawDayStreak(); return; }   // 오늘은 이미 받았다 — 칩 숫자만 맞춰둔다
  const y = new Date(); y.setDate(y.getDate() - 1);
  const p = x => String(x).padStart(2, '0');
  const yesterday = `${y.getFullYear()}-${p(y.getMonth()+1)}-${p(y.getDate())}`;

  const kept = (S.lastDay === yesterday);
  const first = !S.lastDay;
  S.dayStreak = kept ? (S.dayStreak || 0) + 1 : 1;
  S.lastDay = today;

  const gain = dayReward(S.dayStreak);
  S.energy = Math.min(DAY_MAX_ENERGY, S.energy + gain);
  if(S.energy >= ENERGY_MAX) S.energyAt = 0;
  drawEnergy(); drawDayStreak(); saveNow();

  /* 알림은 토스트로만 한다.
     팝업으로 띄웠더니 앱을 켠 직후 게임 화면 위로 끼어들어, 마침 판을 깬 사람의
     클리어 화면까지 가로챘다. 보상은 조용히 주고 진행 상황은 '내 기록'에서 본다. */
  if(first && !S.tutDone) return;                 // 첫 실행에는 조용히 넘어간다
  setTimeout(() => toast(`📅 ${S.dayStreak}일 연속 출석! 하트 +${gain}`, '#F0A020'), 900);
}
/* [next #7] 메인 화면 칩에 연속 출석일을 보여준다. 전엔 '내 기록' 안에 들어가야만 보였다.
   999일(약 2.7년)을 넘으면 "999+"로 표시만 줄인다 — 좁은 화면(320px)에서 네 자리 숫자가
   타이틀 "지뢰찾기 1231"을 두 줄로 밀어내는 걸 확인해서, 저장값은 그대로 두고 표시만 자른다.
   정확한 연속일수는 '내 기록'에서 그대로 볼 수 있다. */
function drawDayStreak(){
  const el = document.getElementById('dayStreakNum');
  if(!el) return;
  const n = S.dayStreak || 0;
  el.textContent = n > 999 ? '999+' : n;
  const ico = el.previousElementSibling;
  if(ico && !ico.firstChild) ico.innerHTML = CAL_SVG;
}
/* 7일 한 바퀴를 점으로 — '내 기록'에서 보여준다 */
function dayDotsHtml(){
  const streak = S.dayStreak || 0;
  const cur = streak ? ((streak - 1) % 7) + 1 : 0;
  return Array.from({length: 7}, (_, i) => {
    const day = i + 1;
    return `<div class="daydot${day <= cur ? ' on' : ''}${day === cur ? ' now' : ''}">
      <b>${day}</b><span>♥${dayReward(day)}</span></div>`;
  }).join('');
}

/* ── 하트 ─────────────────────────────
   판을 못 깨면 하나 줄고, 4개 이하일 때 30분마다 하나씩 찬다.
   평소 상한은 5 그대로 — 출석 보너스로만 최대 10까지 쌓인다 (DAY_MAX_ENERGY 참고). */
const ENERGY_MAX = 5, ENERGY_MS = 30 * 60 * 1000;

function tickEnergy(){
  const now = Date.now();
  /* 기기 시계가 뒤로 간 경우(여행·시간대 변경·자동 보정) energyAt이 미래에 남아
     하트 회복이 몇 시간씩 얼어붙는다 — 미래로 밀려 있으면 지금으로 끌어온다 */
  if(S.energyAt > now + 60000) S.energyAt = now;
  if(S.energy >= ENERGY_MAX){ S.energyAt = 0; return; }   // 보너스로 넘친 하트는 줄지 않는다
  if(!S.energyAt){ S.energyAt = now; return; }
  const gained = Math.floor((now - S.energyAt) / ENERGY_MS);
  if(gained > 0){
    S.energy = Math.min(ENERGY_MAX, S.energy + gained);
    S.energyAt = S.energy >= ENERGY_MAX ? 0 : S.energyAt + gained * ENERGY_MS;
    save();
  }
}

function energyLeftMs(){
  if(S.energy >= ENERGY_MAX || !S.energyAt) return 0;
  return Math.max(0, ENERGY_MS - (Date.now() - S.energyAt));
}

function drawEnergy(){
  tickEnergy();
  const el = document.getElementById('btnEnergy');
  if(!el) return;
  const empty = S.energy <= 0;
  el.classList.toggle('empty', empty);
  const ms = energyLeftMs();
  const mm = String(Math.floor(ms / 60000)).padStart(2, '0');
  const ss = String(Math.floor(ms % 60000 / 1000)).padStart(2, '0');
  el.innerHTML = `<span class="eheart">${HEART_SVG}</span>` +
    (empty ? `<span class="etime">${mm}:${ss}</span>` : `<b>${S.energy}</b>`);
}
setInterval(drawEnergy, 1000);

/* 아직 열리지 않은 판인지 — 깬 판과 지금까지 도달한 판까지만 갈 수 있다 */
function isLocked(lv){
  if(!S.tutDone) return false;

/* 하트가 없으면 새 판을 시작할 수 없다 (이미 깬 판은 언제든 다시 도전 가능) */
function canPlay(lv){
  tickEnergy();
  return !S.tutDone || !!S.recs[lv] || S.energy > 0;
}

/* ═══════════════════════════════════════════════════════════
   광고 — 구글 애드몹 (Capacitor 플러그인)

   설치:  npm install @capacitor-community/admob
          npx cap sync

   ⚠️ 출시 직전에 TEST 를 false 로 바꾸십시오.
      개발 중에 실제 광고를 누르면 애드몹 계정이 정지됩니다.
   ═══════════════════════════════════════════════════════════ */
const Ads = (() => {
  const TEST = false;                      // 출시 전 반드시 전환 (release_guard.ps1 이 검사한다)

  const ID = TEST ? {
    banner:  'ca-app-pub-3940256099942544/6300978111',   // 구글 공식 테스트
    rewarded:'ca-app-pub-3940256099942544/5224354917',
  } : {
    banner:  'ca-app-pub-5842326439702577/8797716750',
    rewarded:'ca-app-pub-5842326439702577/9000791530',
  };

  const plugin = () => (window.Capacitor && window.Capacitor.Plugins)
                     ? window.Capacitor.Plugins.AdMob : null;
  let ready = false, rewardedLoaded = false;

  let started = false;
  async function init(){
    if(started) return;                   // deviceready 와 800ms 타임아웃이 둘 다 오면 두 번 돈다
    started = true;
    const A = plugin();
    if(!A){ started = false; return; }    // 웹에서는 조용히 넘어간다 (플러그인이 늦게 붙을 수도 있다)
    try{
      /* 실제로 붙은 배너 높이(dp)를 받아 광고 자리 높이(--adh)를 맞추고 판을 다시 잰다.
         적응형 배너는 폭에 따라 50~90dp 사이라 56px 고정값과 어긋날 수 있다. */
      try{
        A.addListener('bannerAdSizeChanged', info => {
          const h = info && Number(info.height);
          if(Number.isFinite(h) && h > 0) document.documentElement.style.setProperty('--adh', h + 'px');
          requestAnimationFrame(fitBoard);
        });
      }catch(e){}
      await A.initialize({ testingDevices: [], initializeForTesting: TEST });
      ready = true;
      showBanner();
      preloadRewarded();
    }catch(e){ started = false; }   // 초기화 실패면 다음 기회에 다시 시도한다 (3차 검증 §10-3)
  }

  async function showBanner(){
    const A = plugin();
    if(!A || !ready) return;
    try{
      await A.showBanner({
        adId: ID.banner,
        adSize: 'ADAPTIVE_BANNER',
        position: 'BOTTOM_CENTER',
        margin: 0,
        isTesting: TEST,
      });
      const slot = document.getElementById('adSlot');
      if(slot) slot.classList.add('live');   // 안내 글자를 숨긴다
    }catch(e){}
  }

  async function preloadRewarded(){
    const A = plugin();
    if(!A || !ready || rewardedLoaded) return;
    try{
      await A.prepareRewardVideoAd({ adId: ID.rewarded, isTesting: TEST });
      rewardedLoaded = true;
    }catch(e){ rewardedLoaded = false; }
  }

  /* 보상형 광고를 보여주고, 끝까지 봤으면 true 를 준다.
     플러그인이 없거나 광고를 못 불러오면 그냥 보상을 준다
     (인터넷이 끊겼다고 게임을 막지는 않는다).

     ⚠️ 플러그인의 showRewardVideoAd()는 "보상을 받는 순간"에만 풀리고,
     광고를 도중에 닫거나 표시에 실패하면 영원히 안 풀린다 (플러그인 8.1.0 소스 확인).
     그래서 예전엔 '광고 보고 힌트 3개 받기' 시트가 그대로 굳어 있었다 (테스터 리뷰 8번).
     → 닫힘(Dismissed)·표시 실패(FailedToShow) 이벤트로 반드시 끝을 내고,
       보상 처리는 광고가 "닫힌 뒤"에 해서 게임 화면으로 돌아온 다음 토스트가 보이게 한다. */
  let inFlight = null;                  // [PATCH-27c] 버튼이 두 번 눌려도 광고는 하나만 띄운다
  async function reward(){
    const A = plugin();
    if(!A || !ready) return true;
    if(inFlight) return inFlight;
    inFlight = new Promise(resolve => {
      let rewarded = false, settled = false, fallback = null, showCalled = false;
      const subs = [];
      const finish = ok => {
        if(settled) return;
        settled = true;
        inFlight = null;
        clearTimeout(fallback);
        document.removeEventListener('visibilitychange', onVis);
        subs.forEach(h => { try{ Promise.resolve(h).then(x => x && x.remove && x.remove()); }catch(e){} });
        rewardedLoaded = false;
        preloadRewarded();                // 다음 것 미리 준비
        resolve(ok);
      };
      const on = (ev, fn) => { try{ subs.push(A.addListener(ev, fn)); }catch(e){} };
      on('onRewardedVideoAdReward', () => { rewarded = true; });
      on('onRewardedVideoAdDismissed', () => finish(rewarded));   // 끝까지 봤으면 true, 중간에 닫았으면 false
      on('onRewardedVideoAdFailedToShow', () => finish(true));   // 광고 쪽 사정이니 보상은 준다
      /* 안전장치 — 이벤트가 하나도 안 오는 경우: 앱이 다시 전면에 온 뒤 2초가 지나면 마무리한다 */
      const onVis = () => {
        if(document.visibilityState !== 'visible') return;
        /* [PATCH-27c] 광고를 아직 띄우지도 않았으면(준비가 느려 기다리는 중) 마무리하지 않는다.
           예전엔 준비 도중 홈→복귀만 해도 2초 뒤 실패로 끝나, 뒤늦게 뜬 광고를
           끝까지 봐도 보상이 안 나왔다. */
        if(!showCalled) return;
        clearTimeout(fallback);
        fallback = setTimeout(() => finish(rewarded), 2000);
      };
      document.addEventListener('visibilitychange', onVis);
      (async () => {
        try{
          if(!rewardedLoaded) await A.prepareRewardVideoAd({ adId: ID.rewarded, isTesting: TEST });
          showCalled = true;
          const r = await A.showRewardVideoAd();        // 보상 시점에 풀린다 (광고가 닫히기 전)
          if(r) rewarded = true;
        }catch(e){ finish(true); }                      // 준비·표시 실패(인터넷 없음 등) → 보상은 준다
      })();
    });
    return inFlight;
  }

  return { init, reward, showBanner };
})();

if(window.Capacitor) document.addEventListener('deviceready', () => Ads.init(), { once: true });
setTimeout(() => Ads.init(), 800);        // deviceready 가 안 와도 한 번 시도

function resetBoard(){
  if(S.done) return;
  Snd.release(); Vib.tap();
  S.cells = Array.from({length:S.n}, () => new Array(S.n).fill(0));
  S.history = []; S.wrong.clear();
  S.lives = 3; S.fish = 3; S.undoLeft = 3; S.combo = 0; S.lastTip = null; S.tipCells = []; S.pendingTip = null;
  S.stats = {sweeps:0, wasted:0}; S.pureRun = true; S.xTaps = 0; S.bestCombo = 0;
  S.mineFace = {}; S.pipFace = []; S.foundOrder = [];
  toast('이 판을 처음 상태로 되돌렸어요', '#12A98C');
  update();
}

drawEnergy();
if(WEB){
  webDailyBoot();        // [next #8-웹] 공유 링크로 연 브라우저 — 그날 그 판 하나만
} else {
newPuzzle(false);
checkDailyStreak();      // 하루 한 번 출석 보상
prefRestore();           // [next #1] 네이티브 저장소가 더 최신이면 되살린다
dailyInit();             // [next #8 #9] 오늘의 도전 카드 · 알림 예약
}
/* 군중 녹음을 미리 풀어 둔다 — 소리는 첫 터치 뒤에야 열리므로 그때 한 번만 */
document.addEventListener('pointerdown', function preload(){
  document.removeEventListener('pointerdown', preload);
  setTimeout(() => { try{ Snd._loadCrowd(); Snd._loadBooms(); }catch(e){} }, 300);
}, {once:true});
/* 앱을 안 죽이고 백그라운드에만 두는 사람은 콜드스타트가 안 일어나 보상을 못 받았다.
   화면으로 돌아올 때도 한 번 확인한다 — 같은 날이면 안에서 그냥 빠져나온다 (8차 Q4). */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && !WEB){ checkDailyStreak(); drawDailyCard(); scheduleDailyNotifs(); }
});

/* 게임이 다 그려졌으니 시작 화면(스플래시)을 걷어낸다.
   설정이 자동 걷기를 꺼두었어도 여기서 확실히 열어준다. */
(() => {
  const hide = () => {
    const P = window.Capacitor && window.Capacitor.Plugins;
    if(P && P.SplashScreen && P.SplashScreen.hide){
      try{ P.SplashScreen.hide({ fadeOutDuration: 250 }); }catch(e){}
    }
  };
  requestAnimationFrame(() => requestAnimationFrame(hide));
  setTimeout(hide, 1200);                 // 혹시 놓쳤을 때를 위한 두 번째 시도
})();
</script>
